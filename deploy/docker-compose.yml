# Tudo numa VPS: banco + servidor online + versão web.
# Uso (na raiz do repositório):
#   cp deploy/.env.example deploy/.env   # e preencha
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# No Easypanel dá para fazer o mesmo com 3 serviços (Postgres, App server/Dockerfile, App Dockerfile).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tessaria
      POSTGRES_USER: tessaria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessaria -d tessaria"]
      interval: 5s
      retries: 10

  server:
    build: { context: .., dockerfile: server/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://tessaria:${POSTGRES_PASSWORD}@db:5432/tessaria
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      SITE_URL: ${SITE_URL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports: ["${SERVER_PORT:-2567}:2567"]

  web:
    build: { context: .., args: { VITE_API_URL: "${VITE_API_URL:?defina VITE_API_URL}" } }
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  dbdata:
