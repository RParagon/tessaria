name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    name: Gerar APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web e sincronizar com o Android
        run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o Gradle
      # baixa sozinho as plataformas que faltarem.
      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fios-de-tessaria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
